name: baarali-tests

# Baarali's own CI, separate from the upstream x-tests.yml so upstream syncs
# never conflict on it (UPSTREAM.md §2, 30/09/2026).
on:
  # apps/x's main, renderer and core too: the brand test checks that every
  # anchor of desktop/scripts/brand.mjs is still there after an upstream sync.
  pull_request:
    paths:
      - 'apps/baarali/**'
      - 'apps/x/packages/shared/**'
      - 'apps/x/packages/core/**'
      - 'apps/x/apps/main/**'
      - 'apps/x/apps/renderer/**'
      - '.github/workflows/baarali-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/baarali/**'
      - 'apps/x/packages/shared/**'
      - 'apps/x/packages/core/**'
      - 'apps/x/apps/main/**'
      - 'apps/x/apps/renderer/**'
      - '.github/workflows/baarali-tests.yml'
  workflow_dispatch:

jobs:
  cad-runtime:
    name: Instance Linux + real CAD and REA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate provider integrity and extraction rules
        run: python3 -m unittest discover -s apps/baarali/engines/rea -p 'test_*.py'
      # BAARALI(13/10/2026): cover the actual Docker branding inputs and
      # Python wheels as well as the portable Node tests below.
      - name: Build the instance image
        run: docker build -t baarali-instance-check -f apps/baarali/packages/instance/Dockerfile .
      - name: Validate the actual CAD engine and exports
        run: >-
          docker run --rm --entrypoint node
          -v "${{ github.workspace }}/apps/baarali/packages/instance/scripts/check-cad-runtime.mjs:/tmp/check-cad-runtime.mjs:ro"
          baarali-instance-check /tmp/check-cad-runtime.mjs
      - name: Compile a native analysis fixture
        run: |
          printf 'int baarali_fixture(int n) { return n * 3 + 7; }\n' > /tmp/baarali-rea-fixture.c
          cc -O0 -g -shared -fPIC /tmp/baarali-rea-fixture.c -o /tmp/baarali-rea-fixture.so
      - name: Validate REA catalog, tracing, native decompilation and cleanup
        run: >-
          docker run --rm --memory=2g --cpus=1 --entrypoint node
          -e BAARALI_REA_LAUNCHER=/app/instance/dist/rea-main.js
          -e BAARALI_REA_NATIVE_TARGET=/tmp/baarali-rea-fixture.so
          -v /tmp/baarali-rea-fixture.so:/tmp/baarali-rea-fixture.so:ro
          -v "${{ github.workspace }}/apps/baarali/packages/instance/scripts/check-rea-runtime.mjs:/tmp/check-rea-runtime.mjs:ro"
          baarali-instance-check /tmp/check-rea-runtime.mjs

  apps-baarali:
    name: apps/baarali typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/harbor/pnpm-lock.yaml
            apps/x/pnpm-lock.yaml
            apps/baarali/pnpm-lock.yaml

      # @x/shared links @rowboat/spaces-protocol from harbor, and we link
      # @x/shared: build the chain in order, as x-tests.yml does.
      - name: Build apps/harbor (link deps)
        run: pnpm install --frozen-lockfile && pnpm -r build
        working-directory: apps/harbor

      - name: Install apps/x
        run: pnpm install --frozen-lockfile
        working-directory: apps/x

      - name: Build @x/shared
        run: npm run build
        working-directory: apps/x/packages/shared

      - name: Install apps/baarali
        run: pnpm install --frozen-lockfile
        working-directory: apps/baarali

      - name: Typecheck
        run: pnpm typecheck
        working-directory: apps/baarali

      - name: Test
        # 13/10/2026: full source scans share the runner with PGlite suites;
        # bound concurrency so CPU contention does not masquerade as a failure.
        run: pnpm --workspace-concurrency=1 -r test --maxWorkers=2
        working-directory: apps/baarali

      - name: Build
        run: pnpm build
        working-directory: apps/baarali

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0

      - name: Install the isolated REA lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/baarali/engines/rea

      - name: Verify the Baarali SDK against the real REA server
        run: node scripts/check-rea-sdk.mjs
        working-directory: apps/baarali/packages/instance

      - name: Apply the approved desktop layout to the CI checkout
        run: node apps/baarali/packages/desktop/scripts/brand.mjs --yes

      - name: Test desktop Chat and Work access
        run: pnpm exec vitest run src/components/desktop-workspace.test.tsx src/components/desktop-code-home.test.tsx src/components/code/code-view.test.tsx src/components/chat-input-harness.test.tsx --maxWorkers=1
        working-directory: apps/x/apps/renderer
