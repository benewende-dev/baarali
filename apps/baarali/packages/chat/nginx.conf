# One page (Expo web, output « single »): every path the app routes to answers
# index.html; the hashed bundles and assets are kept a year by browsers.
server {
  listen 8080;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml font/ttf;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location = /healthz { return 200 'ok'; }
  location /_expo/static/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /assets/ { expires 30d; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
