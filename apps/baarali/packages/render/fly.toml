# baarali-render on Fly, Paris (Studio Motion step 2, decided 08/10/2026).
# No public IP: the control plane reaches it over Flycast, with
# BAARALI_RENDER_SECRET. The service stops its machine after 10 idle minutes
# (main.ts), never during a render; the next request starts it again.
# One machine to start with (deploy --ha=false): one render at a time, the
# next ones queue. A second machine needs the control plane to spread jobs.
app = "baarali-render"
primary_region = "cdg"

[env]
  RENDER_CONCURRENCY = "1"
  # Measured 08/10/2026 on performance-2x/4 GB: 182 s for 10 s of video. At
  # 8 GB or less the producer picks its low-memory profile (one capture
  # browser); Fly has no GPU, so capture is by screenshot either way, and
  # speed comes from browsers in parallel, one per core.
  PRODUCER_LOW_MEMORY_MODE = "false"
  PRODUCER_MAX_WORKERS = "4"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 50

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

# Exiting when idle stops the machine; a crash restarts it.
[[restart]]
  policy = "on-failure"
  retries = 3

[[vm]]
  size = "performance-4x"
  memory = "8gb"
